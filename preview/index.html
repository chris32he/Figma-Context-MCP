<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Preview - Intermediary Schema Validator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1e1e1e;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      background: #252526;
      padding: 12px 20px;
      border-bottom: 1px solid #3e3e42;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #cccccc;
    }

    .header .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .header button {
      background: #0e639c;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .header button:hover {
      background: #1177bb;
    }

    .header button.secondary {
      background: #3e3e42;
    }

    .header button.secondary:hover {
      background: #505050;
    }

    .header .info {
      font-size: 12px;
      color: #858585;
    }

    .container {
      display: flex;
      height: calc(100vh - 50px);
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #3e3e42;
      overflow: hidden;
    }

    .panel:last-child {
      border-right: none;
    }

    .panel-header {
      background: #2d2d30;
      padding: 10px 16px;
      border-bottom: 1px solid #3e3e42;
      font-size: 13px;
      font-weight: 600;
      color: #cccccc;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-header .badge {
      background: #0e639c;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }

    .panel-content {
      flex: 1;
      overflow: auto;
      background: #ffffff;
    }

    .figma-embed {
      width: 100%;
      height: 100%;
      border: none;
    }

    .rendered-output {
      padding: 20px;
      background: #f5f5f5;
      min-height: 100%;
    }

    .inspector-panel {
      max-width: 400px;
      background: #252526;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .inspector-content {
      flex: 1;
      overflow: auto;
      padding: 16px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
    }

    .node-tree {
      list-style: none;
    }

    .node-tree li {
      margin: 4px 0;
    }

    .node-item {
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .node-item:hover {
      background: #2a2d2e;
    }

    .node-item.selected {
      background: #0e639c;
      color: #fff;
    }

    .node-type {
      color: #4ec9b0;
      font-weight: 600;
      font-size: 11px;
    }

    .node-name {
      color: #9cdcfe;
      flex: 1;
    }

    .node-details {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 4px;
      margin-top: 12px;
    }

    .node-details pre {
      color: #d4d4d4;
      font-size: 11px;
      line-height: 1.5;
      overflow-x: auto;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 14px;
      color: #858585;
    }

    .error {
      padding: 20px;
      background: #5a1d1d;
      color: #f48771;
      border-radius: 4px;
      margin: 20px;
    }

    .stats {
      display: flex;
      gap: 20px;
      padding: 12px 16px;
      background: #2d2d30;
      border-bottom: 1px solid #3e3e42;
      font-size: 12px;
    }

    .stat-item {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .stat-label {
      color: #858585;
    }

    .stat-value {
      color: #cccccc;
      font-weight: 600;
    }

    /* Highlight nodes on hover in rendered output */
    .rendered-output [data-node-id]:hover {
      outline: 2px solid #0e639c;
      outline-offset: 2px;
    }

    .figma-design-root > * {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎨 Figma Preview - Intermediary Schema Validator</h1>
    <div class="controls">
      <div class="info" id="file-info">Loading...</div>
      <button class="secondary" onclick="toggleInspector()">Toggle Inspector</button>
      <button onclick="reload()">Reload</button>
    </div>
  </div>

  <div class="container">
    <!-- Figma Embed Panel -->
    <div class="panel">
      <div class="panel-header">
        <span>Figma Original</span>
        <span class="badge">Source</span>
      </div>
      <div class="panel-content">
        <iframe id="figma-embed" class="figma-embed"></iframe>
      </div>
    </div>

    <!-- Rendered Output Panel -->
    <div class="panel">
      <div class="panel-header">
        <span>Rendered from Intermediary Schema</span>
        <span class="badge">Preview</span>
      </div>
      <div class="stats" id="stats"></div>
      <div class="panel-content">
        <div id="rendered-output" class="rendered-output">
          <div class="loading">Loading design data...</div>
        </div>
      </div>
    </div>

    <!-- Inspector Panel -->
    <div class="inspector-panel" id="inspector">
      <div class="panel-header">
        <span>Inspector</span>
        <span class="badge" id="node-count">0 nodes</span>
      </div>
      <div class="inspector-content">
        <div id="node-details">
          <p style="color: #858585;">Click on a node to inspect its properties</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    let currentDesign = null;
    let selectedNodeId = null;

    // Fetch the design data from the server
    async function loadDesign() {
      try {
        const response = await fetch('/api/design');
        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        currentDesign = data.design;

        // Update file info
        document.getElementById('file-info').textContent = `${data.design.name}`;

        // Load Figma embed
        if (data.figmaUrl) {
          const embedUrl = convertToEmbedUrl(data.figmaUrl);
          document.getElementById('figma-embed').src = embedUrl;
        }

        // Render the design
        renderDesign();

        // Update stats
        updateStats();

      } catch (error) {
        console.error('Failed to load design:', error);
        document.getElementById('rendered-output').innerHTML = `
          <div class="error">
            <strong>Error loading design:</strong><br>
            ${error.message}
          </div>
        `;
      }
    }

    function convertToEmbedUrl(figmaUrl) {
      // Convert regular Figma URL to embed URL
      // https://www.figma.com/file/ABC123/Name?node-id=1:2
      // -> https://www.figma.com/embed?embed_host=preview&url=...
      return `https://www.figma.com/embed?embed_host=preview&url=${encodeURIComponent(figmaUrl)}`;
    }

    function renderDesign() {
      if (!currentDesign) return;

      const container = document.getElementById('rendered-output');
      container.innerHTML = '';

      // Render nodes
      currentDesign.nodes.forEach(node => {
        const element = renderNode(node);
        if (element) {
          container.appendChild(element);
        }
      });

      // Add click handlers for inspection
      container.querySelectorAll('[data-node-id]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const nodeId = el.getAttribute('data-node-id');
          selectNode(nodeId);
        });
      });
    }

    function renderNode(node) {
      // Skip certain node types
      if (node.type === 'DOCUMENT' || node.type === 'CANVAS') {
        const fragment = document.createElement('div');
        fragment.className = 'canvas-wrapper';
        if (node.children) {
          node.children.forEach(child => {
            const el = renderNode(child);
            if (el) fragment.appendChild(el);
          });
        }
        return fragment;
      }

      const element = createElementForNode(node);

      // Apply styles
      applyLayout(element, node);
      applyVisuals(element, node);
      applyText(element, node);
      applyEffects(element, node);

      // Add debug info
      element.setAttribute('data-node-id', node.id);
      element.setAttribute('data-node-name', node.name);
      element.setAttribute('data-node-type', node.type);
      element.title = `${node.type}: ${node.name}`;

      // Render children
      if (node.children && node.children.length > 0) {
        node.children.forEach(child => {
          const childElement = renderNode(child);
          if (childElement) {
            element.appendChild(childElement);
          }
        });
      }

      return element;
    }

    function createElementForNode(node) {
      if (node.type === 'TEXT') {
        const div = document.createElement('div');
        div.className = 'figma-text';
        div.textContent = node.text || '';
        return div;
      }

      if (node.type === 'IMAGE-SVG') {
        const div = document.createElement('div');
        div.className = 'figma-svg';
        div.innerHTML = `<div style="background: #ddd; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666;">SVG: ${node.name}</div>`;
        return div;
      }

      const div = document.createElement('div');
      div.className = `figma-${node.type.toLowerCase()}`;
      return div;
    }

    function applyLayout(element, node) {
      if (!node.layout) return;

      const layout = resolveStyle(node.layout);
      if (!layout) return;

      element.style.display = 'flex';
      element.style.boxSizing = 'border-box';

      if (layout.mode === 'row') {
        element.style.flexDirection = 'row';
      } else if (layout.mode === 'column') {
        element.style.flexDirection = 'column';
      } else {
        element.style.display = 'block';
      }

      if (layout.justifyContent) element.style.justifyContent = layout.justifyContent;
      if (layout.alignItems) element.style.alignItems = layout.alignItems;
      if (layout.alignSelf) element.style.alignSelf = layout.alignSelf;
      if (layout.wrap) element.style.flexWrap = 'wrap';
      if (layout.gap) element.style.gap = layout.gap;
      if (layout.padding) element.style.padding = layout.padding;

      if (layout.dimensions) {
        if (layout.dimensions.width !== undefined) {
          element.style.width = `${layout.dimensions.width}px`;
        }
        if (layout.dimensions.height !== undefined) {
          element.style.height = `${layout.dimensions.height}px`;
        }
        if (layout.dimensions.aspectRatio !== undefined) {
          element.style.aspectRatio = String(layout.dimensions.aspectRatio);
        }
      }

      if (layout.sizing) {
        if (layout.sizing.horizontal === 'fill') {
          element.style.flexGrow = '1';
          element.style.width = '100%';
        } else if (layout.sizing.horizontal === 'hug') {
          element.style.width = 'fit-content';
        }

        if (layout.sizing.vertical === 'fill') {
          element.style.flexGrow = '1';
          element.style.height = '100%';
        } else if (layout.sizing.vertical === 'hug') {
          element.style.height = 'fit-content';
        }
      }

      if (layout.position === 'absolute') {
        element.style.position = 'absolute';
        if (layout.locationRelativeToParent) {
          element.style.left = `${layout.locationRelativeToParent.x}px`;
          element.style.top = `${layout.locationRelativeToParent.y}px`;
        }
      }

      if (layout.overflowScroll) {
        if (layout.overflowScroll.includes('x') && layout.overflowScroll.includes('y')) {
          element.style.overflow = 'auto';
        } else if (layout.overflowScroll.includes('x')) {
          element.style.overflowX = 'auto';
        } else if (layout.overflowScroll.includes('y')) {
          element.style.overflowY = 'auto';
        }
      }
    }

    function applyVisuals(element, node) {
      if (node.fills) {
        const fills = resolveStyle(node.fills);
        if (fills) {
          if (Array.isArray(fills)) {
            element.style.background = fills.join(', ');
          } else {
            element.style.background = fills;
          }
        }
      }

      if (node.strokes) {
        const strokes = resolveStyle(node.strokes);
        if (strokes) {
          element.style.border = `${node.strokeWeight || '1px'} solid ${strokes}`;
        }
      }

      if (node.strokeDashes && node.strokeDashes.length > 0) {
        element.style.borderStyle = 'dashed';
      }

      if (node.borderRadius) {
        element.style.borderRadius = node.borderRadius;
      }

      if (node.opacity !== undefined) {
        element.style.opacity = String(node.opacity);
      }
    }

    function applyText(element, node) {
      if (!node.textStyle) return;

      const textStyle = resolveStyle(node.textStyle);
      if (!textStyle) return;

      if (textStyle.fontFamily) element.style.fontFamily = textStyle.fontFamily;
      if (textStyle.fontWeight) element.style.fontWeight = String(textStyle.fontWeight);
      if (textStyle.fontSize) element.style.fontSize = `${textStyle.fontSize}px`;
      if (textStyle.lineHeight) element.style.lineHeight = textStyle.lineHeight;
      if (textStyle.letterSpacing) element.style.letterSpacing = textStyle.letterSpacing;
      if (textStyle.textCase) element.style.textTransform = textStyle.textCase.toLowerCase();
      if (textStyle.textAlignHorizontal) element.style.textAlign = textStyle.textAlignHorizontal.toLowerCase();
      if (textStyle.textAlignVertical) element.style.alignItems = textStyle.textAlignVertical.toLowerCase();
    }

    function applyEffects(element, node) {
      if (!node.effects) return;

      const effects = resolveStyle(node.effects);
      if (!effects) return;

      if (effects.boxShadow) element.style.boxShadow = effects.boxShadow;
      if (effects.filter) element.style.filter = effects.filter;
      if (effects.backdropFilter) element.style.backdropFilter = effects.backdropFilter;
      if (effects.textShadow) element.style.textShadow = effects.textShadow;
    }

    function resolveStyle(styleRef) {
      if (!styleRef) return null;

      if (currentDesign.globalVars.styles && currentDesign.globalVars.styles[styleRef]) {
        return currentDesign.globalVars.styles[styleRef];
      }

      return styleRef;
    }

    function selectNode(nodeId) {
      selectedNodeId = nodeId;
      const node = findNodeById(currentDesign.nodes, nodeId);

      if (node) {
        displayNodeDetails(node);

        // Highlight in rendered output
        document.querySelectorAll('[data-node-id]').forEach(el => {
          el.style.outline = '';
        });
        const element = document.querySelector(`[data-node-id="${nodeId}"]`);
        if (element) {
          element.style.outline = '2px solid #0e639c';
          element.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    }

    function findNodeById(nodes, id) {
      for (const node of nodes) {
        if (node.id === id) return node;
        if (node.children) {
          const found = findNodeById(node.children, id);
          if (found) return found;
        }
      }
      return null;
    }

    function displayNodeDetails(node) {
      const container = document.getElementById('node-details');

      // Resolve styles
      const resolvedNode = { ...node };
      if (node.layout && currentDesign.globalVars.styles[node.layout]) {
        resolvedNode.layout = currentDesign.globalVars.styles[node.layout];
      }
      if (node.fills && currentDesign.globalVars.styles[node.fills]) {
        resolvedNode.fills = currentDesign.globalVars.styles[node.fills];
      }
      if (node.textStyle && currentDesign.globalVars.styles[node.textStyle]) {
        resolvedNode.textStyle = currentDesign.globalVars.styles[node.textStyle];
      }
      if (node.effects && currentDesign.globalVars.styles[node.effects]) {
        resolvedNode.effects = currentDesign.globalVars.styles[node.effects];
      }

      container.innerHTML = `
        <div class="node-details">
          <pre>${JSON.stringify(resolvedNode, null, 2)}</pre>
        </div>
      `;
    }

    function updateStats() {
      const nodeCount = countNodes(currentDesign.nodes);
      const styleCount = Object.keys(currentDesign.globalVars.styles || {}).length;
      const componentCount = Object.keys(currentDesign.components || {}).length;

      document.getElementById('stats').innerHTML = `
        <div class="stat-item">
          <span class="stat-label">Nodes:</span>
          <span class="stat-value">${nodeCount}</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Styles:</span>
          <span class="stat-value">${styleCount}</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Components:</span>
          <span class="stat-value">${componentCount}</span>
        </div>
      `;

      document.getElementById('node-count').textContent = `${nodeCount} nodes`;
    }

    function countNodes(nodes) {
      let count = nodes.length;
      nodes.forEach(node => {
        if (node.children) {
          count += countNodes(node.children);
        }
      });
      return count;
    }

    function toggleInspector() {
      const inspector = document.getElementById('inspector');
      inspector.style.display = inspector.style.display === 'none' ? 'flex' : 'none';
    }

    function reload() {
      window.location.reload();
    }

    // Load design on page load
    loadDesign();
  </script>
</body>
</html>
