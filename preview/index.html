<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Preview - Intermediary Schema Validator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1e1e1e;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      background: #252526;
      padding: 12px 20px;
      border-bottom: 1px solid #3e3e42;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #cccccc;
    }

    .header .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .header button {
      background: #0e639c;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .header button:hover {
      background: #1177bb;
    }

    .header button.secondary {
      background: #3e3e42;
    }

    .header button.secondary:hover {
      background: #505050;
    }

    .header .info {
      font-size: 12px;
      color: #858585;
    }

    .container {
      display: flex;
      height: calc(100vh - 50px);
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #3e3e42;
      overflow: hidden;
    }

    .panel:last-child {
      border-right: none;
    }

    .panel-header {
      background: #2d2d30;
      padding: 10px 16px;
      border-bottom: 1px solid #3e3e42;
      font-size: 13px;
      font-weight: 600;
      color: #cccccc;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-header .badge {
      background: #0e639c;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }

    .panel-content {
      flex: 1;
      overflow: auto;
      background: #ffffff;
    }

    .figma-embed {
      width: 100%;
      height: 100%;
      border: none;
    }

    .rendered-output {
      position: relative;
      padding: 20px;
      background: #f5f5f5;
      min-height: 100%;
    }

    .inspector-panel {
      max-width: 400px;
      background: #252526;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .inspector-content {
      flex: 1;
      overflow: auto;
      padding: 16px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
    }

    .node-tree {
      list-style: none;
    }

    .node-tree li {
      margin: 4px 0;
    }

    .node-item {
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .node-item:hover {
      background: #2a2d2e;
    }

    .node-item.selected {
      background: #0e639c;
      color: #fff;
    }

    .node-type {
      color: #4ec9b0;
      font-weight: 600;
      font-size: 11px;
    }

    .node-name {
      color: #9cdcfe;
      flex: 1;
    }

    .node-details {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 4px;
      margin-top: 12px;
    }

    .node-details pre {
      color: #d4d4d4;
      font-size: 11px;
      line-height: 1.5;
      overflow-x: auto;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 14px;
      color: #858585;
    }

    .error {
      padding: 20px;
      background: #5a1d1d;
      color: #f48771;
      border-radius: 4px;
      margin: 20px;
    }

    .stats {
      display: flex;
      gap: 20px;
      padding: 12px 16px;
      background: #2d2d30;
      border-bottom: 1px solid #3e3e42;
      font-size: 12px;
    }

    .stat-item {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .stat-label {
      color: #858585;
    }

    .stat-value {
      color: #cccccc;
      font-weight: 600;
    }

    /* Highlight nodes on hover in rendered output */
    .rendered-output [data-node-id]:hover {
      outline: 2px solid #0e639c;
      outline-offset: 2px;
    }

    .figma-design-root > * {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎨 Figma Preview - Intermediary Schema Validator</h1>
    <div class="controls">
      <div class="info" id="file-info">Loading...</div>
      <button class="secondary" onclick="toggleInspector()">Toggle Inspector</button>
      <button onclick="reload()">Reload</button>
    </div>
  </div>

  <div class="container">
    <!-- Figma Embed Panel -->
    <div class="panel">
      <div class="panel-header">
        <span>Figma Original</span>
        <span class="badge">Source</span>
      </div>
      <div class="panel-content">
        <iframe id="figma-embed" class="figma-embed"></iframe>
      </div>
    </div>

    <!-- Rendered Output Panel -->
    <div class="panel">
      <div class="panel-header">
        <span>Rendered from Intermediary Schema</span>
        <span class="badge">Preview</span>
        <button class="secondary" onclick="showDebugConsole()" style="font-size: 11px; padding: 3px 8px; margin-left: 8px;">Debug Console</button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="panel-content">
        <div id="rendered-output" class="rendered-output">
          <div class="loading">Loading design data...</div>
        </div>
      </div>
    </div>

    <!-- Inspector Panel -->
    <div class="inspector-panel" id="inspector">
      <div class="panel-header">
        <span>Inspector</span>
        <span class="badge" id="node-count">0 nodes</span>
        <button class="secondary" onclick="showDebugData()" style="font-size: 11px; padding: 3px 8px; margin-left: 8px;">Show Raw Data</button>
      </div>
      <div class="inspector-content">
        <div id="node-details">
          <p style="color: #858585;">Click on a node to inspect its properties</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    let currentDesign = null;
    let selectedNodeId = null;

    // Fetch the design data from the server
    async function loadDesign() {
      try {
        const response = await fetch('/api/design');
        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        currentDesign = data.design;

        // Update file info
        document.getElementById('file-info').textContent = `${data.design.name}`;

        // Load Figma embed
        if (data.figmaUrl) {
          const embedUrl = convertToEmbedUrl(data.figmaUrl);
          document.getElementById('figma-embed').src = embedUrl;
        }

        // Render the design
        renderDesign();

        // Update stats
        updateStats();

      } catch (error) {
        console.error('Failed to load design:', error);
        document.getElementById('rendered-output').innerHTML = `
          <div class="error">
            <strong>Error loading design:</strong><br>
            ${error.message}
          </div>
        `;
      }
    }

    function convertToEmbedUrl(figmaUrl) {
      // Convert regular Figma URL to embed URL
      // https://www.figma.com/file/ABC123/Name?node-id=1:2
      // -> https://www.figma.com/embed?embed_host=preview&url=...
      return `https://www.figma.com/embed?embed_host=preview&url=${encodeURIComponent(figmaUrl)}`;
    }

    function renderDesign() {
      if (!currentDesign) return;

      const container = document.getElementById('rendered-output');
      container.innerHTML = '';

      // Render nodes
      currentDesign.nodes.forEach(node => {
        const element = renderNode(node);
        if (element) {
          container.appendChild(element);
        }
      });

      // Add click handlers for inspection
      container.querySelectorAll('[data-node-id]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const nodeId = el.getAttribute('data-node-id');
          selectNode(nodeId);
        });
      });
    }

    function renderNode(node) {
      // Skip certain node types
      if (node.type === 'DOCUMENT' || node.type === 'CANVAS') {
        const fragment = document.createElement('div');
        fragment.className = 'canvas-wrapper';

        // Canvas wrapper needs positioning context for absolutely positioned children
        fragment.style.position = 'relative';
        fragment.style.width = '100%';
        fragment.style.minHeight = '100vh';

        if (node.children) {
          node.children.forEach(child => {
            const el = renderNode(child);
            if (el) fragment.appendChild(el);
          });
        }
        return fragment;
      }

      const element = createElementForNode(node);

      // Apply styles
      applyLayout(element, node);
      applyVisuals(element, node);
      applyText(element, node);
      applyEffects(element, node);

      // Add debug info
      element.setAttribute('data-node-id', node.id);
      element.setAttribute('data-node-name', node.name);
      element.setAttribute('data-node-type', node.type);
      element.title = `${node.type}: ${node.name}`;

      // Render children
      if (node.children && node.children.length > 0) {
        node.children.forEach(child => {
          const childElement = renderNode(child);
          if (childElement) {
            element.appendChild(childElement);
          }
        });
      }

      return element;
    }

    function createElementForNode(node) {
      if (node.type === 'TEXT') {
        const div = document.createElement('div');
        div.className = 'figma-text';
        div.textContent = node.text || '';
        return div;
      }

      if (node.type === 'IMAGE-SVG') {
        // For SVG nodes, create an img element that loads the downloaded SVG
        const img = document.createElement('img');
        img.className = 'figma-svg';
        // SVGs are downloaded with sanitized names in preview.ts
        const sanitizedName = node.name
          .replace(/[^a-z0-9-_]/gi, '-')
          .replace(/-+/g, '-')
          .toLowerCase()
          .substring(0, 50);
        img.src = `/assets/${sanitizedName}-${node.id}.svg`;
        img.alt = node.name;
        img.style.display = 'block';
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'contain';

        // Add error handler to show placeholder if SVG fails to load
        img.onerror = () => {
          const div = document.createElement('div');
          div.style.cssText = 'background: #ddd; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666;';
          div.textContent = `SVG: ${node.name} (not found)`;
          img.replaceWith(div);
        };

        return img;
      }

      const div = document.createElement('div');
      div.className = `figma-${node.type.toLowerCase()}`;
      return div;
    }

    function applyLayout(element, node) {
      if (!node.layout) return;

      const layout = resolveStyle(node.layout);
      if (!layout) return;

      element.style.boxSizing = 'border-box';

      // Determine if this node should be absolutely positioned
      // This happens when:
      // 1. position is explicitly 'absolute', OR
      // 2. It has locationRelativeToParent (meaning it's not in an auto-layout flow)
      const useAbsolutePositioning = layout.position === 'absolute' ||
        (layout.locationRelativeToParent && layout.mode !== 'row' && layout.mode !== 'column');

      if (useAbsolutePositioning) {
        element.style.position = 'absolute';
        if (layout.locationRelativeToParent) {
          element.style.left = `${layout.locationRelativeToParent.x}px`;
          element.style.top = `${layout.locationRelativeToParent.y}px`;
        }
      }

      // Apply display mode based on layout mode
      if (layout.mode === 'row' || layout.mode === 'column') {
        element.style.display = 'flex';
        element.style.flexDirection = layout.mode;

        if (layout.justifyContent) element.style.justifyContent = layout.justifyContent;
        if (layout.alignItems) element.style.alignItems = layout.alignItems;
        if (layout.wrap) element.style.flexWrap = 'wrap';
        if (layout.gap) element.style.gap = layout.gap;
      } else if (layout.mode === 'none') {
        // mode === 'none' - no autolayout, use relative positioning to contain absolutely positioned children
        if (!useAbsolutePositioning) {
          element.style.position = 'relative';
        }
      }

      if (layout.alignSelf) element.style.alignSelf = layout.alignSelf;
      if (layout.padding) element.style.padding = layout.padding;

      // Apply dimensions
      if (layout.dimensions) {
        if (layout.dimensions.width !== undefined && layout.dimensions.width !== null) {
          element.style.width = `${layout.dimensions.width}px`;
        }
        if (layout.dimensions.height !== undefined && layout.dimensions.height !== null) {
          element.style.height = `${layout.dimensions.height}px`;
        }
        if (layout.dimensions.aspectRatio !== undefined) {
          element.style.aspectRatio = String(layout.dimensions.aspectRatio);
        }

        // Debug: Log missing dimensions for nodes with image fills
        if (node.fills) {
          const fills = resolveStyle(node.fills);
          const hasImage = fills && Array.isArray(fills) && fills.some(f => f && f.type === 'IMAGE');
          if (hasImage && (!layout.dimensions.width || !layout.dimensions.height)) {
            addDebugLog('warn', `Image node "${node.name}" missing dimensions: w=${layout.dimensions.width}, h=${layout.dimensions.height}`);
          }
        }
      } else {
        // No dimensions object at all - log warning for nodes with image fills
        if (node.fills) {
          const fills = resolveStyle(node.fills);
          const hasImage = fills && Array.isArray(fills) && fills.some(f => f && f.type === 'IMAGE');
          if (hasImage) {
            addDebugLog('error', `Image node "${node.name}" has NO dimensions object in layout`);
          }
        }
      }

      // Apply sizing constraints
      if (layout.sizing) {
        if (layout.sizing.horizontal === 'fill') {
          element.style.flexGrow = '1';
          element.style.width = '100%';
        } else if (layout.sizing.horizontal === 'hug') {
          element.style.width = 'fit-content';
        }

        if (layout.sizing.vertical === 'fill') {
          element.style.flexGrow = '1';
          element.style.height = '100%';
        } else if (layout.sizing.vertical === 'hug') {
          element.style.height = 'fit-content';
        }
      }

      // Apply overflow
      if (layout.overflowScroll) {
        if (layout.overflowScroll.includes('x') && layout.overflowScroll.includes('y')) {
          element.style.overflow = 'auto';
        } else if (layout.overflowScroll.includes('x')) {
          element.style.overflowX = 'auto';
        } else if (layout.overflowScroll.includes('y')) {
          element.style.overflowY = 'auto';
        }
      }
    }

    function applyVisuals(element, node) {
      // Fills - always an array in globalVars
      if (node.fills) {
        const fillsArray = resolveStyle(node.fills);
        if (fillsArray && Array.isArray(fillsArray)) {
          // Check if any fills are images
          const hasImageFill = fillsArray.some(fill => fill && typeof fill === 'object' && fill.type === 'IMAGE');
          if (hasImageFill) {
            element.setAttribute('data-has-image', 'true');
            fillsArray.forEach(fill => {
              if (fill && typeof fill === 'object' && fill.type === 'IMAGE' && fill.imageRef) {
                addDebugLog('info', `Image fill: ${fill.imageRef} on node ${node.name}`);
              }
            });
          }

          const cssValues = fillsArray.map(fill => convertFillToCSS(fill, element)).filter(Boolean);
          if (cssValues.length > 0) {
            element.style.background = cssValues.join(', ');
            element.setAttribute('data-bg-css', cssValues.join(', '));
          }
        }
      }

      // Strokes - can be an object with colors array or a direct color array
      if (node.strokes) {
        const strokesData = resolveStyle(node.strokes);
        if (strokesData) {
          let strokeColors;
          let strokeWeight = node.strokeWeight || '1px';

          // Handle both object format {colors, strokeWeight} and direct array
          if (strokesData.colors) {
            strokeColors = strokesData.colors;
            if (strokesData.strokeWeight) strokeWeight = strokesData.strokeWeight;
          } else if (Array.isArray(strokesData)) {
            strokeColors = strokesData;
          } else {
            strokeColors = [strokesData];
          }

          if (strokeColors && strokeColors.length > 0) {
            const strokeColor = strokeColors[0]; // Use first stroke color
            element.style.border = `${strokeWeight} solid ${strokeColor}`;
          }
        }
      }

      if (node.strokeDashes && node.strokeDashes.length > 0) {
        element.style.borderStyle = 'dashed';
      }

      if (node.borderRadius) {
        element.style.borderRadius = node.borderRadius;
      }

      if (node.opacity !== undefined) {
        element.style.opacity = String(node.opacity);
      }
    }

    function convertFillToCSS(fill, element) {
      // Simple color string
      if (typeof fill === 'string') {
        return fill;
      }

      // Complex fill object
      if (fill && typeof fill === 'object') {
        if (fill.type === 'IMAGE') {
          // Use the downloaded image if available
          if (fill.imageRef) {
            // Set background properties for proper image display
            if (element) {
              element.style.backgroundSize = 'cover';
              element.style.backgroundPosition = 'center';
              element.style.backgroundRepeat = 'no-repeat';
            }
            return `url(/assets/${fill.imageRef}.png)`;
          }
          // Fallback placeholder
          return `linear-gradient(135deg, #ddd 25%, transparent 25%, transparent 75%, #ddd 75%, #ddd)`;
        } else if (fill.type === 'GRADIENT_LINEAR' || fill.type === 'GRADIENT_RADIAL' || fill.type === 'GRADIENT_ANGULAR' || fill.type === 'GRADIENT_DIAMOND') {
          return fill.gradient || '';
        } else if (fill.type === 'PATTERN') {
          return `linear-gradient(135deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%, #eee)`;
        }
      }

      return null;
    }

    function applyText(element, node) {
      if (!node.textStyle) return;

      const textStyle = resolveStyle(node.textStyle);
      if (!textStyle) return;

      if (textStyle.fontFamily) element.style.fontFamily = textStyle.fontFamily;
      if (textStyle.fontWeight) element.style.fontWeight = String(textStyle.fontWeight);
      if (textStyle.fontSize) element.style.fontSize = `${textStyle.fontSize}px`;
      if (textStyle.lineHeight) element.style.lineHeight = textStyle.lineHeight;
      if (textStyle.letterSpacing) element.style.letterSpacing = textStyle.letterSpacing;
      if (textStyle.textCase) element.style.textTransform = textStyle.textCase.toLowerCase();
      if (textStyle.textAlignHorizontal) element.style.textAlign = textStyle.textAlignHorizontal.toLowerCase();
      if (textStyle.textAlignVertical) element.style.alignItems = textStyle.textAlignVertical.toLowerCase();
    }

    function applyEffects(element, node) {
      if (!node.effects) return;

      const effects = resolveStyle(node.effects);
      if (!effects) return;

      if (effects.boxShadow) element.style.boxShadow = effects.boxShadow;
      if (effects.filter) element.style.filter = effects.filter;
      if (effects.backdropFilter) element.style.backdropFilter = effects.backdropFilter;
      if (effects.textShadow) element.style.textShadow = effects.textShadow;
    }

    function resolveStyle(styleRef) {
      if (!styleRef) return null;

      if (currentDesign.globalVars.styles && currentDesign.globalVars.styles[styleRef]) {
        return currentDesign.globalVars.styles[styleRef];
      }

      return styleRef;
    }

    function selectNode(nodeId) {
      selectedNodeId = nodeId;
      const node = findNodeById(currentDesign.nodes, nodeId);

      if (node) {
        displayNodeDetails(node);

        // Highlight in rendered output
        document.querySelectorAll('[data-node-id]').forEach(el => {
          el.style.outline = '';
        });
        const element = document.querySelector(`[data-node-id="${nodeId}"]`);
        if (element) {
          element.style.outline = '2px solid #0e639c';
          element.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    }

    function findNodeById(nodes, id) {
      for (const node of nodes) {
        if (node.id === id) return node;
        if (node.children) {
          const found = findNodeById(node.children, id);
          if (found) return found;
        }
      }
      return null;
    }

    function displayNodeDetails(node) {
      const container = document.getElementById('node-details');
      const element = document.querySelector(`[data-node-id="${node.id}"]`);

      // Resolve styles
      const resolvedNode = { ...node };
      if (node.layout && currentDesign.globalVars.styles[node.layout]) {
        resolvedNode.layout = currentDesign.globalVars.styles[node.layout];
      }
      if (node.fills && currentDesign.globalVars.styles[node.fills]) {
        resolvedNode.fills = currentDesign.globalVars.styles[node.fills];
      }
      if (node.textStyle && currentDesign.globalVars.styles[node.textStyle]) {
        resolvedNode.textStyle = currentDesign.globalVars.styles[node.textStyle];
      }
      if (node.effects && currentDesign.globalVars.styles[node.effects]) {
        resolvedNode.effects = currentDesign.globalVars.styles[node.effects];
      }

      // Get applied CSS from the element
      const appliedCSS = element ? {
        background: element.style.background || 'none',
        position: element.style.position || 'static',
        left: element.style.left || 'auto',
        top: element.style.top || 'auto',
        width: element.style.width || 'auto',
        height: element.style.height || 'auto',
        display: element.style.display || 'block',
        flexDirection: element.style.flexDirection || 'none',
      } : {};

      // Check for images
      const hasImage = element?.getAttribute('data-has-image') === 'true';
      const bgCSS = element?.getAttribute('data-bg-css') || 'none';

      container.innerHTML = `
        <div style="margin-bottom: 12px;">
          <h3 style="color: #4ec9b0; margin: 0;">${node.type}: ${node.name}</h3>
          ${hasImage ? '<div style="color: #dcdcaa; margin-top: 4px;">🖼️ Has image fill</div>' : ''}
        </div>

        <div style="margin-bottom: 16px;">
          <h4 style="color: #569cd6; margin-bottom: 8px;">Applied CSS</h4>
          <div style="background: #252526; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 11px;">
            ${Object.entries(appliedCSS).map(([key, value]) => `<div><span style="color: #9cdcfe;">${key}</span>: <span style="color: #ce9178;">${value}</span></div>`).join('')}
          </div>
        </div>

        ${hasImage ? `
        <div style="margin-bottom: 16px;">
          <h4 style="color: #569cd6; margin-bottom: 8px;">Background CSS</h4>
          <div style="background: #252526; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 11px; word-break: break-all;">
            ${bgCSS}
          </div>
        </div>
        ` : ''}

        <div style="margin-bottom: 16px;">
          <h4 style="color: #569cd6; margin-bottom: 8px;">Intermediary Schema</h4>
          <button onclick="console.log(${JSON.stringify(JSON.stringify(resolvedNode))}); alert('Logged to console')" style="padding: 4px 8px; margin-bottom: 8px; font-size: 11px;">Log to Console</button>
          <div class="node-details">
            <pre>${JSON.stringify(resolvedNode, null, 2)}</pre>
          </div>
        </div>
      `;
    }

    function updateStats() {
      const nodeCount = countNodes(currentDesign.nodes);
      const styleCount = Object.keys(currentDesign.globalVars.styles || {}).length;
      const componentCount = Object.keys(currentDesign.components || {}).length;

      document.getElementById('stats').innerHTML = `
        <div class="stat-item">
          <span class="stat-label">Nodes:</span>
          <span class="stat-value">${nodeCount}</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Styles:</span>
          <span class="stat-value">${styleCount}</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Components:</span>
          <span class="stat-value">${componentCount}</span>
        </div>
      `;

      document.getElementById('node-count').textContent = `${nodeCount} nodes`;
    }

    function countNodes(nodes) {
      let count = nodes.length;
      nodes.forEach(node => {
        if (node.children) {
          count += countNodes(node.children);
        }
      });
      return count;
    }

    function toggleInspector() {
      const inspector = document.getElementById('inspector');
      inspector.style.display = inspector.style.display === 'none' ? 'flex' : 'none';
    }

    function reload() {
      window.location.reload();
    }

    function showDebugData() {
      if (!currentDesign) {
        alert('No design data loaded');
        return;
      }

      const container = document.getElementById('node-details');
      container.innerHTML = `
        <div style="margin-bottom: 12px;">
          <button onclick="showDebugData()" style="padding: 6px 12px; margin-right: 8px;">Full Data</button>
          <button onclick="document.getElementById('node-details').innerHTML='<p style=color:#858585>Click on a node to inspect its properties</p>'" style="padding: 6px 12px;">Clear</button>
        </div>
        <div class="node-details">
          <pre>${JSON.stringify(currentDesign, null, 2)}</pre>
        </div>
      `;
    }

    // Debug tools
    const debugLog = [];

    window.showDebugConsole = () => {
      const modal = document.createElement('div');
      modal.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 10000; overflow: auto; padding: 40px;';

      const content = document.createElement('div');
      content.style.cssText = 'background: #1e1e1e; color: #d4d4d4; padding: 20px; border-radius: 8px; max-width: 1200px; margin: 0 auto; font-family: monospace; font-size: 12px;';

      content.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 style="margin: 0; color: #fff;">Debug Console</h2>
          <button onclick="this.parentElement.parentElement.parentElement.remove()" style="padding: 8px 16px; cursor: pointer;">Close</button>
        </div>

        <div style="margin-bottom: 20px;">
          <h3 style="color: #4ec9b0; margin-bottom: 10px;">Debug Log (${debugLog.length} entries)</h3>
          <div style="background: #252526; padding: 10px; border-radius: 4px; max-height: 300px; overflow-y: auto;">
            ${debugLog.length > 0 ? debugLog.map(log => `<div style="margin: 4px 0; color: ${log.type === 'error' ? '#f48771' : log.type === 'warn' ? '#dcdcaa' : '#d4d4d4'};">[${log.type}] ${log.message}</div>`).join('') : '<div style="color: #858585;">No logs yet</div>'}
          </div>
        </div>

        <div style="margin-bottom: 20px;">
          <h3 style="color: #4ec9b0; margin-bottom: 10px;">Image Assets</h3>
          <button onclick="checkImageAssets()" style="padding: 6px 12px; margin-bottom: 10px; cursor: pointer;">Check All Images</button>
          <div id="image-check-results" style="background: #252526; padding: 10px; border-radius: 4px;"></div>
        </div>

        <div style="margin-bottom: 20px;">
          <h3 style="color: #4ec9b0; margin-bottom: 10px;">Style References</h3>
          <div style="background: #252526; padding: 10px; border-radius: 4px; max-height: 300px; overflow-y: auto;">
            ${Object.keys(currentDesign?.globalVars?.styles || {}).length} total styles
            <button onclick="console.log(currentDesign.globalVars.styles); alert('Logged to console')" style="margin-left: 10px; padding: 4px 8px; cursor: pointer;">Log to Console</button>
          </div>
        </div>

        <div>
          <h3 style="color: #4ec9b0; margin-bottom: 10px;">Quick Actions</h3>
          <button onclick="window.debugDesign()" style="padding: 6px 12px; margin-right: 8px; cursor: pointer;">debugDesign()</button>
          <button onclick="console.log('Nodes:', currentDesign.nodes)" style="padding: 6px 12px; margin-right: 8px; cursor: pointer;">Log Nodes</button>
          <button onclick="highlightAllImages()" style="padding: 6px 12px; cursor: pointer;">Highlight Image Nodes</button>
        </div>
      `;

      modal.appendChild(content);
      document.body.appendChild(modal);
    };

    window.checkImageAssets = async () => {
      const resultDiv = document.getElementById('image-check-results');
      resultDiv.innerHTML = '<div>Checking images...</div>';

      // Collect all image references from the design
      const imageRefs = new Set();
      const collectImages = (styles) => {
        for (const [key, value] of Object.entries(styles)) {
          if (Array.isArray(value)) {
            value.forEach(fill => {
              if (fill && typeof fill === 'object' && fill.type === 'IMAGE' && fill.imageRef) {
                imageRefs.add(fill.imageRef);
              }
            });
          }
        }
      };

      collectImages(currentDesign.globalVars.styles);

      if (imageRefs.size === 0) {
        resultDiv.innerHTML = '<div style="color: #858585;">No image references found in design</div>';
        return;
      }

      const results = [];
      for (const imageRef of imageRefs) {
        const url = `/assets/${imageRef}.png`;
        try {
          const response = await fetch(url, { method: 'HEAD' });
          const status = response.ok ? '✅' : '❌';
          const color = response.ok ? '#89d185' : '#f48771';
          results.push(`<div style="color: ${color};">${status} ${imageRef}.png (${response.status})</div>`);
        } catch (err) {
          results.push(`<div style="color: #f48771;">❌ ${imageRef}.png (failed to fetch)</div>`);
        }
      }

      resultDiv.innerHTML = results.join('');
    };

    window.highlightAllImages = () => {
      document.querySelectorAll('[data-has-image]').forEach(el => {
        el.style.outline = '3px solid #00ff00';
        el.style.outlineOffset = '2px';
      });
      setTimeout(() => {
        document.querySelectorAll('[data-has-image]').forEach(el => {
          el.style.outline = '';
          el.style.outlineOffset = '';
        });
      }, 3000);
    };

    function addDebugLog(type, message) {
      debugLog.push({ type, message, timestamp: new Date().toISOString() });
      console.log(`[${type.toUpperCase()}]`, message);
    }

    // Add global debug logging
    window.debugDesign = () => {
      console.log('=== CURRENT DESIGN ===');
      console.log('Nodes:', currentDesign.nodes);
      console.log('GlobalVars.styles:', currentDesign.globalVars.styles);
      console.log('Components:', currentDesign.components);
      console.log('Full design:', currentDesign);
    };

    // Load design on page load
    loadDesign().then(() => {
      console.log('%c✅ Design loaded! Type debugDesign() in console to inspect', 'color: #0e639c; font-weight: bold');
      addDebugLog('info', 'Design loaded successfully');
    });
  </script>
</body>
</html>
